<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#2f6fde">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Shop reports</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon.svg">
  <link rel="stylesheet" href="/app.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <div id="login" class="login hidden"></div>
  <div id="app" class="hidden">
    <header>
      <div class="title">
        <h1 id="store-name"></h1>
        <div id="status" class="status"></div>
      </div>
      <button id="menu-button" class="icon-btn" type="button">Menu</button>
      <div id="menu" class="menu hidden">
        <div id="menu-who" class="who"></div>
        <button id="menu-refresh" type="button"></button>
        <button id="menu-lang" type="button"></button>
        <button id="menu-signout" type="button"></button>
      </div>
    </header>
    <nav id="tabs" class="tabs"></nav>
    <main id="content"></main>
  </div>
</body>
</html>
